name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'billbill/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    defaults:
      run:
        working-directory: billbill
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: billbill/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt "pyinstaller>=6.20,<7"
      - name: Test and check source
        run: |
          python -m unittest discover -s tests -t tests -p "test_*.py" -v
      - name: Download verified native runtime
        run: python ci/prepare_runtime.py
      - name: Build and test package
        run: python ci/package.py
      - name: Upload package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BillBill-${{ matrix.target }}
          path: billbill/artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
